<script>
const C={navy:'#1e3a5f',blue:'#1e40af',bl:'#dbeafe',green:'#047857',gl:'#a7f3d0',purple:'#6d28d9',pl:'#ddd6fe',muted:'#64748b',text:'#374151',white:'#ffffff'};

text(402,115,'审核流程',24,C.blue,true);text(552,115,'在流程内，分别建设机审、人审任务',20,C.muted);
node('b1',175,160,170,'准备数据','接入 · 来源',C.blue);

text(22,535,'Nex',42,C.green,true);text(22,570,'新的操作',18,C.muted);
rect(372,420,838,230,C.white,C.green,20);

node('r1',175,555,170,'算子准备','复用 / 新建',C.purple);

node('n4',925,505,255,'任务流程','机审 + 标注 + 质检',C.green);
node('n5',1285,505,285,'作业与质量闭环','审核 → 质检 → 纠错',C.green);

path([[347,480],[365,480],[365,555],[392,555]],C.green,false,true);

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function mapSVG(nodes={},selected='',showGuide=false,animateGuide=false){
 let bits=marks.map(e=>{
  if(e.type==='text')return `<text x="${e.x}" y="${e.y}" font-size="${e.size}" font-weight="${e.bold?650:400}" fill="${e.color}">${esc(e.s)}</text>`;
  if(e.type==='rect')return `<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.r}" fill="${e.fill}" stroke="${e.stroke}" stroke-width="1.6"/>`;
  if(e.type==='path'){let pts=e.points,ab=pts.at(-2),b=pts.at(-1),ang=Math.atan2(b[1]-ab[1],b[0]-ab[0]),l=12;return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${e.color}" stroke-width="2.5" ${e.dash?'stroke-dasharray="7 6"':''}/>`+(e.arrow?`<path d="M${b[0]-l*Math.cos(ang-.45)},${b[1]-l*Math.sin(ang-.45)} L${b.join(',')} L${b[0]-l*Math.cos(ang+.45)},${b[1]-l*Math.sin(ang+.45)}" fill="none" stroke="${e.color}" stroke-width="2.5"/>`:'');}
  if(e.type==='node')return `<g class="map-node ${selected===e.id?'selected':''}" role="button" tabindex="0" data-node="${e.id}" aria-label="${esc(nodes[e.id]?.title||e.title)}"><title>点击查看操作说明与完整截图</title><rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="12" fill="${selected===e.id?e.color:C.white}" stroke="${e.color}" stroke-width="2.4"/><text x="${e.x+16}" y="${e.y+38}" font-size="25" font-weight="650" fill="${selected===e.id?C.white:C.navy}">${esc(nodes[e.id]?.mapTitle||e.title)}</text><text x="${e.x+16}" y="${e.y+74}" font-size="19" fill="${selected===e.id?C.white:C.muted}">${esc(nodes[e.id]?.mapSub||e.sub)}</text></g>`;
  return `<g class="map-node" role="button" tabindex="0" data-node="${e.id}" aria-label="${esc(nodes[e.id]?.title||e.title)}"><title>点击查看操作说明与完整截图</title><rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="10" fill="${C.white}" stroke="${e.color}" stroke-width="1.8" ${e.type==='resource'?'stroke-dasharray="6 4"':''}/><text x="${e.x+18}" y="${e.y+e.h/2+8}" font-size="${e.type==='resource'?21:24}" font-weight="550" fill="${e.color}">${esc(e.title)}</text></g>`;
 }).join('');
 const guide=showGuide?`<g class="click-guide ${animateGuide?'guide-motion':''}" role="button" tabindex="0" data-node="b1" aria-label="点任一步，看操作与截图；从第一步开始"><rect x="175" y="12" width="408" height="54" rx="14" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text x="195" y="47" font-size="27" font-weight="600" fill="#b42332">点任一步，看操作与截图</text><path d="M260 73 V145 M251 134 L260 145 L269 134" fill="none" stroke="#b42332" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`:'';
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 775" width="1600" height="775" role="img" aria-label="BIZ 与 Nex 完整操作路径" font-family="Heiti SC,PingFang SC,Arial,sans-serif">${bits}${guide}</svg>`;
}

let DATA=JSON.parse(document.getElementById('meetingData').textContent);
let current=null,shotIndex=0,mode='overview',hasViewedStep=false,guidePlayed=false;
const $=id=>document.getElementById(id);
function bindMap(){document.querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>showNode(el.dataset.node);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showNode(el.dataset.node)}}});}
function head(){ $('pageTitle').textContent=DATA.title;$('pageSubtitle').textContent=DATA.subtitle;document.querySelector('.top').classList.toggle('compact',mode!=='overview');}
function showOverview(){mode='overview';current=null;$('overview').hidden=false;$('detailWrap').hidden=true;$('overviewBtn').classList.add('primary');$('map').innerHTML=mapSVG(DATA.nodes,'',!hasViewedStep,!guidePlayed)+`<div class="compact-map">${!hasViewedStep?`<button class="mobile-guide ${!guidePlayed?'guide-motion':''}" data-node="b1">点任一步，看操作与截图 <span aria-hidden="true">↓</span></button>`:''}${[['BIZ',['b1','b2','b3','b4','b5']],['Nex',['n1','n2','n3','n4','n5']]].map(([p,ids])=>`<div class="compact-column"><h2>${p}</h2>${ids.map((id,i)=>`${i?'<div class="down">↓</div>':''}${id==='n2'?'<button class="resource-note" data-node="r1">创建前准备：复用 / 新建算子</button>':''}<button data-node="${id}"><b>${esc(DATA.nodes[id].title)}</b><span>${esc(marks.find(m=>m.id===id)?.sub||'')}</span></button>`).join('')}${p==='Nex'?'<div class="down">↑</div><button data-node="a1">配置不变：追加数据批次</button>':''}</div>`).join('')}</div>`;guidePlayed=true;head();bindMap();window.scrollTo(0,0);}
function mini(){let out='';for(const [name,ids]of[['BIZ',['b1','b2','b3','b4','b5']],['Nex',['n1','r1','n2','n3','n4','n5','a1']]]){out+=`<div class="mini-lane ${name==='Nex'?'nex':''}"><strong>${name}</strong>${ids.map((id,i)=>`${i?`<span>${id==='r1'?'+':id==='a1'?'↻':'→'}</span>`:''}<button data-node="${id}" class="${current===id?'active':''}">${esc(DATA.nodes[id].short)}</button>`).join('')}</div>`} $('mini').innerHTML=out;bindMap();}
function showNode(id){if(!DATA.nodes[id])return;hasViewedStep=true;mode='detail';current=id;shotIndex=0;$('overview').hidden=true;$('detailWrap').hidden=false;$('overviewBtn').classList.remove('primary');head();renderNode();window.scrollTo(0,0);}
function renderNode(){let n=DATA.nodes[current];mini();$('stepIndex').textContent=n.platform+' · '+(DATA.order.indexOf(current)+1)+' / '+DATA.order.length;$('detailTitle').textContent=n.title;$('lead').textContent=n.lead;$('path').textContent=n.path;$('groups').innerHTML=n.groups.map((g,i)=>`<div class="group"><span class="num">${i+1}</span><div><h3>${esc(g[0])}</h3><p>${esc(g[1])}</p></div></div>`).join('');$('note').textContent=n.note;$('prevStep').disabled=DATA.order.indexOf(current)===0;$('nextStep').textContent=current===DATA.order.at(-1)?'回到全链路总览 ↗':'下一步 →';renderShot();}
function renderShot(){let n=DATA.nodes[current],s=n.shots[shotIndex];document.querySelector('.shotcontrols').hidden=!s;document.querySelector('.pager').hidden=n.shots.length<2;if(!s){$('shotTitle').textContent='日常追加回路';$('shotFrame').innerHTML=`<div class="empty"><b>新增批次 → 沿用配置 → 继续作业</b><span>${esc(n.empty||'暂无实际截图')}</span></div>`;$('shotCaption').textContent='创建路径已核验；实际截图待补。';return;}
 let im=DATA.images[s.n];let vb=[0,0,im.w,im.h];$('shotTitle').textContent=s.label;$('shotFrame').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" aria-label="${esc(s.label)}"><image x="0" y="0" width="${im.w}" height="${im.h}" href="${im.src}"/></svg>`;$('shotFrame').onclick=openImage;$('shotCaption').textContent=`图 ${String(s.n).padStart(2,'0')} · 当前显示完整页面 · 点击图片可进一步放大`;$('shotCount').textContent=`${shotIndex+1} / ${n.shots.length}`;$('prevShot').disabled=shotIndex===0;$('nextShot').disabled=shotIndex===n.shots.length-1;}
function openImage(){let s=DATA.nodes[current]?.shots[shotIndex];if(!s)return;$('zoomImage').src=DATA.images[s.n].src;$('imageLabel').textContent=s.label;$('imageScroll').classList.remove('actual');$('fitImage').classList.add('active');$('actualImage').classList.remove('active');$('imageDialog').showModal();}
function changeStep(d){let i=current?DATA.order.indexOf(current):-1;if(i+d>=DATA.order.length){showOverview();return}showNode(DATA.order[Math.max(0,i+d)]);}
const field=(key,label,value,rows)=>`<label>${label}${rows?`<textarea name="${key}" rows="${rows}">${esc(value)}</textarea>`:`<input name="${key}" value="${esc(value)}">`}</label>`;
function openEdit(){if(current){let n=DATA.nodes[current];$('editHeading').textContent='编辑：'+n.title;$('editFields').innerHTML=field('title','详细标题',n.title)+`<div class="edit-pair">${field('short','路径导航名称',n.short)}${field('mapTitle','总览节点标题',n.mapTitle||marks.find(m=>m.id===current)?.title||n.short)}</div>`+field('mapSub','总览节点副标题',n.mapSub||marks.find(m=>m.id===current)?.sub||'')+field('lead','这一步要做什么',n.lead,2)+field('path','操作入口',n.path)+field('groups','配置层级（每行：组名 | 说明）',n.groups.map(g=>g.join(' | ')).join('\n'),6)+field('note','补充说明',n.note,3)+(n.shots.length?'<label>替换当前截图<input name="replaceImage" type="file" accept="image/*"></label>':'');}else{$('editHeading').textContent='编辑总览标题';$('editFields').innerHTML=field('title','总览标题',DATA.title)+field('subtitle','副标题',DATA.subtitle);}$('editDialog').showModal();}
$('editForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);if(current){let n=DATA.nodes[current];for(let k of['title','short','mapTitle','mapSub','lead','path','note'])n[k]=String(fd.get(k)||'');n.groups=String(fd.get('groups')).split('\n').filter(Boolean).map(l=>{let i=l.indexOf('|');return i<0?[l,'']:[l.slice(0,i).trim(),l.slice(i+1).trim()]});let f=fd.get('replaceImage');if(f&&f.size){let src=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});let im=new Image;await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=src});let s=n.shots[shotIndex];DATA.images[s.n]={src,w:im.naturalWidth,h:im.naturalHeight};}renderNode();}else{DATA.title=String(fd.get('title'));DATA.subtitle=String(fd.get('subtitle'));head();} $('editDialog').close();};
let savingCopy=false;
function saveMessage(message,error=false){let status=$('saveStatus');status.hidden=false;status.textContent=message;status.classList.toggle('error',error);}
function imageAsDataURL(blob){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('图片打包失败'));reader.readAsDataURL(blob);});}
async function offlineSnapshot(){
 let snapshot=JSON.parse(JSON.stringify(DATA)),entries=Object.entries(snapshot.images),done=0;
 saveMessage(`正在打包原图 ${done} / ${entries.length}，请稍候…`);
 for(let [id,im] of entries){
  if(!im.src.startsWith('data:')){
   let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
   try{
    let response=await fetch(new URL(im.src,document.baseURI),{cache:'force-cache',signal:controller.signal});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let blob=await response.blob();
    if(!blob.size||!blob.type.startsWith('image/'))throw new Error('服务器未返回有效图片');
    im.src=await imageAsDataURL(blob);
   }catch(error){throw new Error(`图 ${String(id).padStart(2,'0')} 无法读取（${error.name==='AbortError'?'读取超时':error.message}）`);}
   finally{clearTimeout(timer);}
  }
  done++;saveMessage(`正在打包原图 ${done} / ${entries.length}，请稍候…`);
 }
 return snapshot;
}
$('saveBtn').onclick=async()=>{
 if(savingCopy)return;
 savingCopy=true;let button=$('saveBtn');button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='正在打包…';
 try{
  let snapshot=await offlineSnapshot(),clone=document.documentElement.cloneNode(true);
  clone.querySelector('#meetingData').textContent=JSON.stringify(snapshot).replace(/<\//g,'<\\/');
  clone.querySelectorAll('dialog').forEach(dialog=>dialog.removeAttribute('open'));
  clone.querySelector('#shotFrame').replaceChildren();
  clone.querySelector('#zoomImage').removeAttribute('src');
  clone.querySelector('#editFields').replaceChildren();
  clone.querySelector('#detailWrap').hidden=true;clone.querySelector('#overview').hidden=false;
  let cloneButton=clone.querySelector('#saveBtn');cloneButton.disabled=false;cloneButton.removeAttribute('aria-busy');cloneButton.textContent='保存修改副本';
  let cloneStatus=clone.querySelector('#saveStatus');cloneStatus.hidden=true;cloneStatus.textContent='';cloneStatus.classList.remove('error');
  // The downloaded copy is self-contained; the separate online static viewer is not embedded.
  clone.querySelectorAll('a[href="static.html"]').forEach(link=>link.remove());
  let blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='BIZ-Nex全链路讲解图-修改版.html';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  saveMessage('修改副本已准备下载，包含全部截图，可离线继续使用。');
 }catch(error){saveMessage(`打包失败：${error.message}。请检查网络后重试，当前修改仍保留在页面中。`,true);}
 finally{savingCopy=false;button.disabled=false;button.removeAttribute('aria-busy');button.textContent='保存修改副本';}
};

$('overviewBtn').onclick=showOverview;$('editBtn').onclick=openEdit;$('closeEdit').onclick=()=>$('editDialog').close();$('fullBtn').onclick=renderShot;$('zoomBtn').onclick=openImage;$('closeImage').onclick=()=>$('imageDialog').close();$('fitImage').onclick=()=>{$('imageScroll').classList.remove('actual');$('fitImage').classList.add('active');$('actualImage').classList.remove('active')};$('actualImage').onclick=()=>{$('imageScroll').classList.add('actual');$('fitImage').classList.remove('active');$('actualImage').classList.add('active')};$('prevShot').onclick=()=>{shotIndex--;renderShot()};$('nextShot').onclick=()=>{shotIndex++;renderShot()};$('prevStep').onclick=()=>changeStep(-1);$('nextStep').onclick=()=>changeStep(1);
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();changeStep(1)}if(e.key==='ArrowLeft'&&current){e.preventDefault();changeStep(-1)}if(e.key==='Escape')showOverview();});showOverview();

</script>
</body></html>
